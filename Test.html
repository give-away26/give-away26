<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Giveaway — Win ₦1,000</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f0f0f0;
    padding: 24px;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient blurred orbs behind the glass */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, #c9a227, #6b4f0e);
    top: -80px;
    left: -80px;
    animation: float1 14s ease-in-out infinite alternate;
  }

  body::after {
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, #b8860b, #1a1a1a);
    bottom: -120px;
    right: -100px;
    animation: float2 16s ease-in-out infinite alternate;
  }

  @keyframes float1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes float2 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-50px, -30px) scale(1.2); }
  }

  .box {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 40px 30px;
    border-radius: 24px;

    /* Glassmorphism */
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);

    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);

    text-align: center;
    transition: transform 0.3s ease;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #f5e08a 0%, #d4af37 50%, #b8860b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #d4af37; /* fallback */
    margin-bottom: 14px;
  }

  .prize {
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.65);
    margin-bottom: 4px;
  }

  .prize b {
    color: #f5e08a;
    font-weight: 600;
  }

  .hint {
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 20px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 15px 18px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 0.95rem;
    letter-spacing: 0.22em;
    text-align: center;
    text-transform: uppercase;
    font-weight: 500;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }

  input::placeholder {
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 0.18em;
    font-weight: 400;
  }

  input:focus {
    border-color: rgba(212, 175, 55, 0.7);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;

    background: linear-gradient(135deg, #f5e08a 0%, #d4af37 45%, #b8860b 100%);
    color: #1a1400;
    box-shadow:
      0 4px 18px rgba(212, 175, 55, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.3s ease;
  }

  button:hover {
    filter: brightness(1.08);
    box-shadow:
      0 6px 26px rgba(212, 175, 55, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px) scale(0.99);
    box-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
  }

  #result {
    margin-top: 22px;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    min-height: 1.4em;
    transition: opacity 0.3s ease;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.35), transparent);
    margin: 22px 0 6px;
  }

  /* Success glow pulse */
  .success-glow {
    animation: glowPulse 1.8s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 8px rgba(180, 255, 120, 0.4); }
    50%      { text-shadow: 0 0 20px rgba(180, 255, 120, 0.9); }
  }
</style>
</head>
<body>

<div class="box">
  <h1>Big Giveaway</h1>
  <p class="prize">A chance to win <b>₦1,000</b></p>

  <div class="divider"></div>

  <p class="hint">Enter your giveaway key</p>

  <input type="text" id="keyInput" placeholder="ENTER KEY" autocomplete="off" spellcheck="false">
  <br>
  <button onclick="claim()">Claim Giveaway</button>

  <p id="result"></p>
</div>

<script>
  let correctKey = "EMM201008";
  let alreadyUsed = false
;

  function claim() {
    let key = document.getElementById("keyInput").value.toUpperCase().trim();
    let result = document.getElementById("result");

    result.classList.remove("success-glow");

    if (key === "") {
      result.textContent = "⚠️ Abeg enter key first";
      result.style.color = "rgba(255, 200, 90, 1)";
      return;
    }

    if (alreadyUsed) {
      result.textContent = "❌ This key don already use!";
      result.style.color = "#ff6b6b";
      return;
    }

    if (key === correctKey) {
      alreadyUsed = true;
      result.textContent = "🎉 CONGRATS! You don win ₦1,000!";
      result.style.color = "#9dff6b";
      result.classList.add("success-glow");
    } else {
      result.textContent = "❌ Invalid key, try again";
      result.style.color = "#ff6b6b";
    }
  }

  // Allow Enter key to trigger claim
  document.getElementById("keyInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") claim();
  });
</script>

</body>
</html>
